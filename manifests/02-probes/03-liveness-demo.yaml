apiVersion: v1
kind: Pod
metadata:
  name: hang-noprobe
  namespace: lab
  labels:
    app: hang-demo
spec:
  containers:
    - name: app
      image: kubelab:v2.1
      imagePullPolicy: IfNotPresent
      command: ["python", "-c"]
      args:
        - |
          import http.server, time
          t0 = time.time()
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if time.time() - t0 > 20:
                      time.sleep(3600)
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"ok")
              def log_message(self, *a):
                  pass
          http.server.HTTPServer(("", 8080), H).serve_forever()
      ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: hang-probe
  namespace: lab
  labels:
    app: hang-demo
spec:
  containers:
    - name: app
      image: kubelab:v2.1
      imagePullPolicy: IfNotPresent
      command: ["python", "-c"]
      args:
        - |
          import http.server, time
          t0 = time.time()
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if time.time() - t0 > 20:
                      time.sleep(3600)
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"ok")
              def log_message(self, *a):
                  pass
          http.server.HTTPServer(("", 8080), H).serve_forever()
      ports:
        - containerPort: 8080
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 1
        failureThreshold: 3
